spring.application.name=analytics-service
server.port=4002

# Kafka consumer (bootstrap servers come from SPRING_KAFKA_BOOTSTRAP_SERVERS)
spring.kafka.consumer.group-id=analytics-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

# Kafka producer (used only to publish poison messages to the dead-letter topic)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Application topics
analytics.kafka.topic=patient
analytics.kafka.dead-letter-topic=${analytics.kafka.topic}.DLT

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
