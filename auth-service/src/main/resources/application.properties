spring.application.name=auth-service
server.port=4005

# Datasource (falls back to an in-memory H2 database for local runs)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Schema is created by Hibernate; data.sql runs afterwards to seed data
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}

# JWT: JWT_SECRET must be a base64 encoded key of at least 256 bits (required)
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=36000000

# Only the health endpoint is exposed
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
