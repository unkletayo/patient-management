# Local stack: docker compose up --build
# Requires JWT_SECRET (see .env.example). Gateway: http://localhost:4004
name: patient-management

x-postgres: &postgres
  image: postgres:17
  environment: &postgres-env
    POSTGRES_USER: admin_user
    POSTGRES_PASSWORD: password
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U admin_user -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 10

x-service-db: &service-db-env
  SPRING_DATASOURCE_USERNAME: admin_user
  SPRING_DATASOURCE_PASSWORD: password
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_SQL_INIT_MODE: always

services:
  auth-service-db:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: auth-service-db
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  patient-service-db:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: patient-service-db
    volumes:
      - patient-db-data:/var/lib/postgresql/data

  billing-service-db:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: billing-service-db
    volumes:
      - billing-db-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # `patient` and `patient.DLT` are created on first use
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    healthcheck:
      # port check: a JVM-based CLI probe is too slow and flaky under load
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  auth-service:
    build: ./auth-service
    environment:
      <<: *service-db-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/auth-service-db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, see .env.example}
    depends_on:
      auth-service-db:
        condition: service_healthy

  billing-service:
    build: ./billing-service
    environment:
      <<: *service-db-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://billing-service-db:5432/billing-service-db
    depends_on:
      billing-service-db:
        condition: service_healthy

  patient-service:
    build: ./patient-service
    environment:
      <<: *service-db-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-service-db:5432/patient-service-db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: "9001"
    depends_on:
      patient-service-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      billing-service:
        condition: service_started

  analytics-service:
    build: ./analytics-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AUTH_SERVICE_URL: http://auth-service:4005
      PATIENT_SERVICE_URL: http://patient-service:4000
      BILLING_SERVICE_URL: http://billing-service:4001
    ports:
      - "4004:4004"
    depends_on:
      - auth-service
      - patient-service
      - billing-service

volumes:
  auth-db-data:
  patient-db-data:
  billing-db-data:
