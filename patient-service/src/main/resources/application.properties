spring.application.name=patient-service
server.port=4000
logging.level.root=info

# Datasource (env: SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD).
# Defaults to an in-memory H2 database for running outside Docker.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:patientdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}

# Pagination: default size 20, requests above 100 are clamped
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Kafka (env: SPRING_KAFKA_BOOTSTRAP_SERVERS)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Billing gRPC client (env: BILLING_SERVICE_ADDRESS / BILLING_SERVICE_GRPC_PORT)
spring.grpc.client.channels.billing.address=${BILLING_SERVICE_ADDRESS:localhost}:${BILLING_SERVICE_GRPC_PORT:9001}
spring.grpc.client.channels.billing.negotiation-type=plaintext
billing.grpc.deadline=5s
