spring.application.name=billing-service

server.port=4001
spring.grpc.server.port=9001

# H2 in-memory fallback for local/test; override via env in deployed environments
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:billingdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.jpa.open-in-view=false
